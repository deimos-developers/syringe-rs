[package]
name = "syringe-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A 32-bit Windows DLL injector and runtime hook loader, ported from SyringeEx"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/deimos-developers/syringe-rs"
homepage = "https://github.com/deimos-developers/syringe-rs"
authors = ["deimos-developers"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["dll-injection", "debugger", "hooking", "windows", "game-modding"]
categories = ["development-tools::debugging", "os::windows-apis"]

[[bin]]
name = "syringe"
path = "src/main.rs"

[lib]
name = "syringe_rs"
path = "src/lib.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zydis = { version = "4.1.1", default-features = false, features = ["std", "encoder"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
